---
- name: Validate application configuration
  ansible.builtin.assert:
    that:
      - app_name is match('^[a-z][a-z0-9_]{0,30}$')
      - app_user is match('^[a-z][a-z0-9_]{0,30}$')
      - app_user not in ['root', 'nobody', 'postgres', 'rabbitmq', 'www-data']
      - app_user != (ansible_user | default('root'))
      - app_domains | length > 0
      - app_domains | reject('match', '^[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9]$') | list | length == 0
      - app_upstream is match('^https?://[a-zA-Z0-9_.:-]+$')
      - app_static_location is match('^/([a-zA-Z0-9_-]+/)+$')
      - app_media_location is match('^/([a-zA-Z0-9_-]+/)+$')
      - not app_nginx_shared_site or app_nginx_shared_site is match('^[a-z][a-z0-9_]{0,30}$')
      - not app_nginx_shared_site or app_nginx_shared_site != app_name
    fail_msg: >-
      Set valid application names, domains and upstream URLs.

- name: Validate selected database and broker resources
  ansible.builtin.assert:
    that:
      - app_database is match('^[a-z][a-z0-9_]{0,62}$')
      - app_database_user is match('^[a-z][a-z0-9_]{0,62}$')
      - app_rabbitmq_vhost | length > 0
      - app_rabbitmq_vhost != '/'
      - app_rabbitmq_user | length > 0
      - app_rabbitmq_user != 'guest'
      - app_postgresql_host in hostvars
      - app_rabbitmq_host in hostvars
      - app_postgresql_client_addresses | length > 0
      - >-
        app_postgresql_host == (app_django_host if app_deploy_code | bool else inventory_hostname) or
        app_postgresql_client_addresses != ['127.0.0.1/32', '::1/128']
    fail_msg: >-
      Set database/broker names and inventory hosts. For a remote database,
      explicitly set app_postgresql_client_addresses to the Django host's
      source address/CIDR.
  when: not (app_deploy_code | bool) or app_django_enabled | bool

- name: Require application passwords
  ansible.builtin.assert:
    that:
      - app_database_password | length > 0
      - app_rabbitmq_password | length > 0
    fail_msg: Supply application passwords through Ansible Vault.
  no_log: true
  when: not (app_deploy_code | bool) or app_django_enabled | bool

- name: Validate selected component topology
  ansible.builtin.assert:
    that:
      - app_django_host in hostvars
      - app_ts_backend_host in hostvars
      - app_ts_ws_backend_host in hostvars
      - not (app_django_enabled | bool) or app_user != (hostvars[app_django_host].ansible_user | default(ansible_user | default('root')))
      - not (app_ts_backend_enabled | bool) or app_user != (hostvars[app_ts_backend_host].ansible_user | default(ansible_user | default('root')))
      - not (app_ts_ws_backend_enabled | bool) or app_user != (hostvars[app_ts_ws_backend_host].ansible_user | default(ansible_user | default('root')))
      - not (celery_enabled | bool or celery_beat_enabled | bool) or app_django_enabled | bool
      - not (app_deploy_code | bool) or (celery_enabled | bool) == (app_django_enabled | bool)
      - not (app_frontend_html_enabled | bool) or (app_frontend_enabled | bool and not (app_django_enabled | bool))
      - app_active_locations | unique | list | length == app_active_locations | length
      - app_active_locations | reject('match', '^/([a-zA-Z0-9_-]+/)*$') | list | length == 0
      - not (app_django_enabled | bool or app_frontend_enabled | bool) or app_static_location not in app_active_locations
      - not (app_django_enabled | bool) or app_active_locations | select('match', '^/(static|media)/') | list | length == 0
      - not app_nginx_shared_site or '/' not in app_active_locations
      - not app_nginx_shared_site or not (certbot_enabled | bool or ddns_enabled | bool)
      - not app_nginx_shared_site or not (app_django_enabled | bool or app_frontend_enabled | bool) or app_static_location != '/static/'
      - not app_nginx_shared_site or not (app_django_enabled | bool) or app_media_location != '/media/'
      - app_active_sockets | unique | list | length == app_active_sockets | length
      - app_active_ports | length == 0 or app_active_ports | map('int') | min > 1023
      - app_active_ports | length == 0 or app_active_ports | map('int') | max < 65536
      - app_ts_backend_upstream is match('^http://[a-zA-Z0-9_.:-]+$')
      - app_ts_ws_backend_upstream is match('^http://[a-zA-Z0-9_.:-]+$')
      - not (app_django_origin_enabled | bool) or app_django_origin_bind is match(app_private_ipv4)
      - not (app_ts_backend_enabled | bool) or app_ts_backend_host == inventory_hostname or app_ts_backend_bind_host is match(app_private_ipv4)
      - not (app_ts_ws_backend_enabled | bool) or app_ts_ws_backend_host == inventory_hostname or app_ts_ws_backend_bind_host is match(app_private_ipv4)
    fail_msg: >-
      Select distinct route prefixes and unprivileged sockets on valid inventory
      hosts. The application user must not be a component host's SSH login.
      Remote components require explicit private IPv4 bind addresses.
      Celery requires Django.
      Code deployments enable Django and the Celery worker together.
      Standalone frontend HTML requires frontend assets with Django disabled.
  vars:
    app_private_ipv4: '^(10[.]|192[.]168[.]|172[.](1[6-9]|2[0-9]|3[01])[.])[0-9.]+$'
    app_active_locations: >-
      {{ ([app_django_location] if app_django_enabled | bool else [])
         + ([app_frontend_html_location] if app_frontend_html_enabled | bool else [])
         + ([app_ts_backend_location] if app_ts_backend_enabled | bool else [])
         + ([app_ts_ws_backend_location] if app_ts_ws_backend_enabled | bool else []) }}
    app_active_sockets: >-
      {{ ([app_django_host + ':' + app_bind] if app_django_enabled | bool else [])
         + ([app_django_host + ':' + app_django_origin_bind + ':' + (app_django_origin_port | string)]
            if app_django_origin_enabled | bool else [])
         + ([app_ts_backend_host + ':' + app_ts_backend_bind_host + ':' + (app_ts_backend_port | string)]
            if app_ts_backend_enabled | bool else [])
         + ([app_ts_ws_backend_host + ':' + app_ts_ws_backend_bind_host + ':' + (app_ts_ws_backend_port | string)]
            if app_ts_ws_backend_enabled | bool else []) }}
    app_active_ports: >-
      {{ ([app_bind.split(':')[-1]] if app_django_enabled | bool else [])
         + ([app_django_origin_port] if app_django_origin_enabled | bool else [])
         + ([app_ts_backend_port] if app_ts_backend_enabled | bool else [])
         + ([app_ts_ws_backend_port] if app_ts_ws_backend_enabled | bool else []) }}
  when: app_deploy_code | bool

- name: Validate DNS and certificate configuration
  ansible.builtin.assert:
    that:
      - not (ddns_enabled | bool) or ddns_domains | length > 0
      - not (certbot_enabled | bool) or certbot_email | length > 0
      - not (certbot_enabled | bool) or certbot_domains | length > 0
      - not (certbot_enabled | bool) or app_domains | difference(certbot_domains) | length == 0
      - ddns_domains | reject('match', '^[a-zA-Z0-9][a-zA-Z0-9.-]*[a-zA-Z0-9]$') | list | length == 0
      - certbot_domains | reject('match', '^[a-zA-Z0-9][a-zA-Z0-9.*-]*[a-zA-Z0-9]$') | list | length == 0
    fail_msg: Set valid DNS names and certificate email/domains before enabling DDNS or Certbot.

- name: Require Domeneshop credentials
  ansible.builtin.assert:
    that:
      - domeneshop_token | length > 0
      - domeneshop_secret | length > 0
      - "'\n' not in domeneshop_token"
      - "'\n' not in domeneshop_secret"
    fail_msg: Supply Domeneshop credentials through Ansible Vault.
  when: ddns_enabled | bool or certbot_enabled | bool
  no_log: true

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_user }}"

- name: Create application Linux user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_user }}"
    home: "{{ app_home }}"
    shell: /usr/sbin/nologin
    password_lock: true
    create_home: true

- name: Allow Nginx to traverse the application directory
  ansible.builtin.file:
    path: "{{ app_home }}"
    state: directory
    owner: "{{ app_user }}"
    group: www-data
    mode: "0750"

- name: Allow Nginx to read Django-created application uploads
  ansible.builtin.user:
    name: www-data
    groups: "{{ app_user }}"
    append: true
  when: app_deploy_code | bool
  notify: Apply application nginx configuration

- name: Create application static directory
  ansible.builtin.file:
    path: "{{ app_home }}/static"
    state: directory
    owner: "{{ app_user }}"
    group: www-data
    mode: "2750"

- name: Create application media directory
  ansible.builtin.file:
    path: "{{ app_home }}/media"
    state: directory
    owner: "{{ app_user }}"
    group: www-data
    mode: "2750"
  when: app_media_enabled | bool

- name: Validate code deployment configuration
  ansible.builtin.assert:
    that:
      - app_repository_dir is match('^/[a-zA-Z0-9_./-]+$')
      - app_code_dir is match('^/[a-zA-Z0-9_./-]+$')
      - app_virtualenv is match('^/[a-zA-Z0-9_./-]+$')
      - app_environment_file is match('^/[a-zA-Z0-9_./-]+$')
      - app_bind is match('^127[.]0[.]0[.]1:[0-9]+$')
      - app_workers | int > 0
      - app_django_module is match('^[a-zA-Z_][a-zA-Z0-9_]*$')
      - not (app_memcached_enabled | bool) or app_memcached_location | trim | length > 0
      - django_secret_key | length > 0
      - "'\n' not in django_secret_key"
      - "'\r' not in django_secret_key"
      - "'\t' not in django_secret_key"
      - "'\n' not in app_database_password"
      - "'\r' not in app_database_password"
      - "'\t' not in app_database_password"
    fail_msg: Supply safe deployment paths, a loopback backend address, an enabled cache location and django_secret_key in Vault.
  when: app_deploy_code | bool and app_django_enabled | bool
  no_log: true

- name: Warn when optional internal session authentication is disabled
  ansible.builtin.debug:
    msg: >-
      DJANGO_INTERNAL_AUTH_TOKEN is not set (django_internal_auth_token);
      internal session authentication is disabled. TypeScript clients remain anonymous.
  when: app_deploy_code | bool and app_django_enabled | bool and not django_internal_auth_token

- name: Warn when optional internal WebSocket notifications are disabled
  ansible.builtin.debug:
    msg: >-
      WS_INTERNAL_NOTIFY_TOKEN is not set (ws_internal_notify_token);
      internal WebSocket notifications are disabled. Anonymous WebSockets remain available.
  when: app_deploy_code | bool and app_ts_ws_backend_enabled | bool and not ws_internal_notify_token

- name: Inspect managed services before code deployment
  ansible.builtin.service_facts:
  delegate_to: "{{ app_django_host }}"
  register: app_django_services
  when: app_deploy_code | bool

- name: Stop application processes before updating code or credentials
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
  delegate_to: "{{ app_django_host }}"
  loop:
    - "gunicorn-{{ app_name }}.service"
    - "celery-{{ app_name }}.service"
    - "celerybeat-{{ app_name }}.service"
  when:
    - app_deploy_code | bool
    - item in app_django_services.ansible_facts.services
    - app_django_services.ansible_facts.services[item].state == 'running'

- name: Prepare the separate Django runtime host
  ansible.builtin.include_tasks:
    file: django-host.yml
    apply:
      delegate_to: "{{ app_django_host }}"
  when:
    - app_deploy_code | bool
    - app_django_enabled | bool
    - app_django_host != inventory_hostname

- name: Configure application database
  ansible.builtin.include_tasks: postgresql.yml
  when: not (app_deploy_code | bool) or app_django_enabled | bool

- name: Configure application RabbitMQ resources
  ansible.builtin.include_tasks: rabbitmq.yml
  when: not (app_deploy_code | bool) or app_django_enabled | bool

- name: Install code, runtime environment and static files
  ansible.builtin.include_tasks:
    file: code.yml
    apply:
      delegate_to: "{{ app_django_host }}"
  when: app_deploy_code | bool and app_django_enabled | bool

- name: Disable an unselected Django backend
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  delegate_to: "{{ app_django_host }}"
  loop:
    - "gunicorn-{{ app_name }}.service"
    - "celery-{{ app_name }}.service"
    - "celerybeat-{{ app_name }}.service"
  when:
    - app_deploy_code | bool
    - not (app_django_enabled | bool)
    - item in app_django_services.ansible_facts.services

- name: Disable the unselected private Django origin
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/{{ app_name }}-origin"
    state: absent
  delegate_to: "{{ app_django_host }}"
  when: app_deploy_code | bool and not (app_django_origin_enabled | bool)
  notify: Apply Django origin nginx configuration

- name: Install standalone prebuilt frontend assets
  ansible.builtin.include_tasks: frontend.yml
  when: app_deploy_code | bool and app_frontend_enabled | bool and not (app_django_enabled | bool)

- name: Deploy selected TypeScript components
  ansible.builtin.include_tasks:
    file: node.yml
    apply:
      delegate_to: "{{ app_node_component.host }}"
  loop: "{{ app_node_components }}"
  loop_control:
    loop_var: app_node_component
    label: "{{ app_node_component.name }}"
  when: app_deploy_code | bool

- name: Create private deployment configuration directory
  ansible.builtin.file:
    path: "{{ app_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: >-
    ddns_enabled | bool or certbot_enabled | bool or
    celery_enabled | bool or celery_beat_enabled | bool

- name: Configure Domeneshop dynamic DNS
  ansible.builtin.include_tasks: ddns.yml

- name: Configure application certificates
  ansible.builtin.include_tasks: certbot.yml

- name: Configure optional application Celery services
  ansible.builtin.include_tasks:
    file: celery.yml
    apply:
      delegate_to: "{{ app_django_host if app_deploy_code | bool else inventory_hostname }}"
  when: not (app_deploy_code | bool) or app_django_enabled | bool

- name: Configure application Nginx site
  ansible.builtin.include_tasks: nginx.yml
