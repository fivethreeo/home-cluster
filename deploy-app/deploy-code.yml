---
- name: Deploy application code and prebuilt frontend
  hosts: all
  become: true
  gather_facts: true
  vars:
    app_deploy_code: true
    app_django_module: prosango
    app_source_dir: "{{ playbook_dir }}/../../{{ app_django_module }}-project"
    app_frontend_dist: "{{ app_source_dir }}/typescript-frontend/dist"
    app_repository_dir: "{{ app_home }}/current"
    app_code_dir: "{{ app_repository_dir }}/django-project"
    app_upstream: >-
      {{ 'http://' + app_bind if app_django_host == inventory_hostname
         else 'http://' + app_django_address + ':' + (app_django_origin_port | string) }}
    app_selected_components: >-
      {{ (['django'] if app_django_enabled | default(true) | bool else [])
         + (['typescript-backend'] if app_ts_backend_enabled | default(false) | bool else [])
         + (['typescript-ws-backend'] if app_ts_ws_backend_enabled | default(false) | bool else []) }}
    celery_app: "{{ app_django_module }}"

  tasks:
    - name: Validate the selected Django module
      ansible.builtin.assert:
        that: app_django_module is match('^[a-zA-Z_][a-zA-Z0-9_]*$')

    - name: Require at least one selected application component
      ansible.builtin.assert:
        that: app_selected_components | length > 0

    - name: Check the selected Django entry point before changing services
      ansible.builtin.stat:
        path: "{{ app_source_dir }}/django-project/{{ app_django_module }}/wsgi.py"
      delegate_to: localhost
      become: false
      register: app_django_entry_point
      when: app_django_enabled | default(true) | bool

    - name: Require the Django module to match the source checkout
      ansible.builtin.assert:
        that: app_django_entry_point.stat.isreg | default(false)
        fail_msg: Set app_django_module and app_source_dir to the same application's module and checkout.
      when: app_django_enabled | default(true) | bool

    - name: Deploy the application using a temporary controller bundle
      block:
        - name: Allocate controller code bundle
          ansible.builtin.tempfile:
            state: file
            suffix: .tar.gz
          delegate_to: localhost
          become: false
          register: app_code_bundle

        - name: Package Django source and already-built frontend
          ansible.builtin.command:
            argv: >-
              {{ [ansible_playbook_python, playbook_dir + '/files/package-prosango.py',
                  app_source_dir, app_frontend_dist, app_code_bundle.path, '--components']
                 + app_selected_components }}
          delegate_to: localhost
          become: false

        - name: Identify this code and asset release
          ansible.builtin.stat:
            path: "{{ app_code_bundle.path }}"
            checksum_algorithm: sha256
          delegate_to: localhost
          become: false
          register: app_bundle_metadata

        - name: Configure resources and deploy the release
          ansible.builtin.include_role:
            name: application

      always:
        - name: Remove temporary controller bundle
          ansible.builtin.file:
            path: "{{ app_code_bundle.path }}"
            state: absent
          delegate_to: localhost
          become: false
          when: app_code_bundle.path is defined
